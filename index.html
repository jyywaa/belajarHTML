<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - E-Commerce SPA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Sticky -->
    <header>
        <h1>GadgetStore <span>Pro</span></h1>
        <div id="user-header-name">Guest</div>
    </header>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Main Container -->
    <div class="app-container">

        <!-- PANEL ADMINISTRATOR (Tampil Khusus Admin: kholi) -->
        <div class="card" id="admin-panel" style="display: none;">
            <div class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Panel Administrator
            </div>
            <form id="admin-form" onsubmit="handleAdminSubmit(event)">
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="admin-name" class="form-control" placeholder="Contoh: Smartphone Pro Max 15" required>
                </div>
                <div class="form-group">
                    <label>Deskripsi & Harga Produk</label>
                    <textarea id="admin-desc" class="form-control" placeholder="Tuliskan spesifikasi dan harga. Contoh: Layar 120Hz, RAM 12GB. Harga: Rp 15.000.000" required></textarea>
                </div>
                
                <!-- INPUT UPLOAD GAMBAR FROM FILE -->
                <div class="form-group">
                    <label>Upload Gambar Produk (Pilih File Gambar)</label>
                    <input type="file" id="admin-image-file" class="form-control" accept="image/*" required>
                </div>

                <!-- INPUT UPLOAD VIDEO FROM FILE -->
                <div class="form-group">
                    <label>Upload Video Demo Produk (Pilih File Video)</label>
                    <input type="file" id="admin-video-file" class="form-control" accept="video/*" required>
                </div>

                <button type="submit" class="btn">Simpan Produk ke Database</button>
            </form>
        </div>

        <hr id="admin-divider" style="border: 0; border-top: 1px solid var(--border); margin: 20px 0; display: none;">

        <!-- PANEL PEMBELI -->
        <section id="view-home" class="view-section active">
            <div class="card-title">🔥 Bestseller Gadget</div>
            <div class="scroll-container" id="bestseller-list"></div>

            <div class="card-title" style="margin-top: 16px;">📱 Koleksi Pilihan</div>
            <div class="product-grid" id="product-grid"></div>
        </section>

        <section id="view-cart" class="view-section">
            <div class="card">
                <div class="card-title">🛒 Keranjang Belanja</div>
                <div id="cart-items-container"></div>
                <div style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px;">
                    <button class="btn btn-accent" onclick="processCheckout()">Checkout (COD)</button>
                </div>
            </div>
        </section>

        <section id="view-profile" class="view-section">
            <div class="card">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                    <div class="profile-avatar" id="profile-role-badge">VIP</div>
                    <div>
                        <h3 id="profile-username">-</h3>
                        <span id="profile-status" class="badge-status">Member</span>
                    </div>
                </div>
                <div style="font-size: 12px; color: var(--text-muted); line-height: 1.6;">
                    <p><strong>Email:</strong> <span id="profile-email">-</span></p>
                    <p><strong>No. HP:</strong> <span id="profile-phone">-</span></p>
                </div>
                <button class="btn btn-outline" onclick="openModal('modal-logout')" style="margin-top: 12px; padding: 8px;">Logout</button>
            </div>
        </section>

    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">Beranda</div>
        <div class="nav-item" onclick="switchTab('cart', this)">Keranjang</div>
        <div class="nav-item" onclick="switchTab('profile', this)">Profil</div>
    </nav>

    <!-- MODAL WIZARD / LOGIN -->
    <div class="modal-overlay" id="modal-onboarding">
        <div class="modal-content">
            <h2 style="font-size: 18px; margin-bottom: 8px;">Selamat Datang!</h2>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;" id="wizard-subtitle">Langkah 1 dari 3: Masukkan Email Anda</p>
            
            <form id="wizard-form" onsubmit="handleWizardStep(event)">
                <div id="wizard-step-1" class="wizard-step">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="wiz-email" class="form-control" placeholder="nama@email.com" required>
                    </div>
                </div>
                <div id="wizard-step-2" class="wizard-step" style="display:none;">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="wiz-username" class="form-control" placeholder="Admin: kholi / Pembeli: Bebas">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="wiz-password" class="form-control" placeholder="Admin: 123 / Pembeli: Bebas">
                    </div>
                </div>
                <div id="wizard-step-3" class="wizard-step" style="display:none;">
                    <div class="form-group">
                        <label>Nomor Telepon</label>
                        <input type="tel" id="wiz-phone" class="form-control" placeholder="08123456789">
                    </div>
                </div>
                <button type="submit" class="btn btn-accent" id="wiz-btn-next">Lanjutkan</button>
            </form>
        </div>
    </div>

    <!-- MODAL LOGOUT -->
    <div class="modal-overlay" id="modal-logout">
        <div class="modal-content" style="text-align: center;">
            <h3>Konfirmasi Logout</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Apakah Anda yakin ingin keluar?</p>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-outline" onclick="closeModal('modal-logout')">Batal</button>
                <button class="btn btn-danger" onclick="confirmLogout()">Ya, Logout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
